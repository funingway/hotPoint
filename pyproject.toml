[project]
name = "hotspot"
version = "0.1.0"
description = "Local hot-topic crawler for tech content creators"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "jinja2>=3",
    "markdown>=3",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "httpx>=0.27",
]

[project.scripts]
hotspot = "hotspot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hotspot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
