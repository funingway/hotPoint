defaults:
  hours: 24
  top_k: 20
  max_comparisons_factor: 3
  concurrency: 4

llm:
  base_url: "http://localhost:11434"
  model: "batiai/gemma4-12b:q4"
  model_path: "D:\\openClaw\\model"
  temperature: 0.3
  max_tokens: 4096
  timeout: 120

sources:
  hackernews:
    enabled: true
    min_points: 10
    rate_limit: 1.0
  reddit:
    enabled: true
    subreddits: ["programming", "MachineLearning", "technology", "artificial"]
    min_score: 20
    rate_limit: 1.0
  arxiv:
    enabled: true
    max_results: 50
  github:
    enabled: true
    min_stars: 50
    token_env: "GITHUB_TOKEN"
  medium:
    enabled: true
    min_claps: 100
    rate_limit: 1.0
  devto:
    enabled: true
    min_reactions: 50
    rate_limit: 1.0

scoring:
  freshness: 0.30
  knowledge_gain: 0.30
  counter_intuitive: 0.20
  relevance: 0.10
  virality: 0.10

elo:
  initial: 1000
  k_factor: 32
  early_stop_threshold: 50
  band: 200

report:
  dir: "./reports"
  db_path: "./hotspot.db"
